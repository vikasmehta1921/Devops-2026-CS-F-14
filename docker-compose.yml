services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-rental-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-rental-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped